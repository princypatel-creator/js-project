<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage Project</title>
    <style>
        body{
            place-items:center;
        }
        .container{
          
            background-color:brown;
            width:1500px;
            height:auto;
        }
.nav-bar{
   
    background-size:cover;
    display:flex;
    width:1500px;
    place-items:center;
    justify-content:space-between;
    gap:9rem;
    height:9rem;
}
.logo{padding-left:2px;}
.bar-list{
    display:inline-flex;
    padding-right:4rem;
    place-items:center;
    font-size:2rem;
    cursor:pointer;
    gap:10rem;
}
.judges-list{position:relative;}
.list{
    display:none;
    position:absolute;
    width:24rem;
    top:100%;
     z-index: 13;
    background-color:white;
    padding:3px;
    border-radius:4px;
    border:3px solid rgba(167, 42, 42,0.2);
}
.judges-list:hover .list {
 display:block;
}
#touch:hover{
    background-color: brown;
    padding:4px;
}
.list-options{
    list-style-type:none;
    padding-left:2px;
}
img{
    width:32%;
}
.sub-container{
    background-image:url(court-photo.jpg);
    width:1500px;
    height:1244px;
    background-size:contain;
    opacity:0.5;
    display:block;
    place-items: center;
    justify-content:center;
}
.details{
    width:1500px;
    height:3rem;
   font-size:2rem;

    color:white;
    background-color:black;
    text-align:center;
}
.form{
    width:1268px;
    height:1234px;
  margin-top:2rem;
  display:flex;
  place-items:center;
  justify-content:center;
    background-color:white;

}
.main-form{
    width:1059px;
    height:1032px;
    background-color:rgb(226, 226, 7);
    align-items:center;
}
form{
    width:1267px;
    height:1223px;
   
}
    </style>

</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <div class="logo"><img src="court-logo.png"></div>
                <div class="bar-list">
                <div id="touch"><a>HOME</a></div>
                <div class="judges-list" id="touch"><a>JUDGES</a>
                <div class="list">
                    <ul class="list-options">
                        <li>Hon'ble Cheif Justice and Sitting Judges</li>
                        <li>Hon'ble Judges as Chief Justice of India</li>
                        <li>Former Hon'ble Chief Justices</li>
                        <li>Former Hon'ble Judges</li>
                        <li>Assets of Judges</li>
                    </ul>
                </div>
            </div>
                <div class="gate-pass" id="touch"><a>GATEPASS</a></div>

            </div>
        </nav>
        <div class="sub-container">
            <div class="details">PRIMARY VISITOR DETAILS</div>
            <div class="form">
                <div class="main-form">
                 <form>
                    <label for="names" >Name:</label>
                    <input type="text" name="names" id="names" placeholder="name here" required><br><br>
                    <label for="fathername">Father/Spouse Name:</label>
                    <input type="text" id="fathername" name="fathername" placeholder="father's name or spouse" required><br><br>
                    <label for="add">Address:</label>
                    <input type="textarea" name="add" id="add" placeholder="you can write up to 42 characters" required><br><br>
                    <label for="occupy">Occupation:</label>
                    <select name="occupy" id="occupy" required>
                        <option value="" disabled selected hidden>Choose an option...</option>
                        <option value="teacher">Teacher</option>
                        <option value="doctor">Doctor</option>
                        <option value="doctor">Engineer</option>
                        <option value="doctor">Farmer</option>
                        <option value="doctor">Household</option>
                    </select><br><br>
                    <label for="proof">Identity Proof:</label>
                    <select name="proof" id="proof" required>
                        <option value="">Choose an option</option>
                        <option value="adharcard">Adhar Card</option>
                        <option value="voterId">Voter Id</option>
                        <option value="passssPort">PassPort</option>
                        <option value="driving">Driving License</option>
                    </select><br><br>
                    <label for="visit">Purpose of Visit:</label>
                    <select id="visit" name="visit" required>
                        <option value="">Choose purpose</option>
                        <option value="court hearing">Court Hearing</option>
                        <option value="filing">Filing</option>
                        <option value="personal">Personal</option>
                        <option value="press">Press</option>
                        <option value="tender">Tender</option>
                        <option value="inspection">Inspection</option>
                    </select><br><br>
                    <label for="branch">Branch Name:</label>
                    <select id="branch" name="branch" required>
                        <option value="">Choose wisely</option>
                        <option value="main buliding">Main Building</option>
                        <option value="accounts">Accounts</option>
                        <option value="medical">Medical</option>
                        <option value="inspection">Inspection</option>
                    </select><br><br>
                    <label for="visitdate">Visit Date:</label>
                    <input type="text" id="visitdate" name="visitname" value="7-11-2026" required readonly><br><br>
                    <label for="gender">Gender:</label>
                  <input type="radio" id="gender" name="gender" value="male" required>Male</input>
                  <input type="radio" id="gender" name="gender" value="female" required>Female</input>
                  <input type="radio" id="gender" name="gender" value="transgender" required>Both</input><br><br>
                    <label for="age">Age:</label>
                    <input type="number" name="age" id="age" reguired placeholder="use arrows"><br><br>
                    <label for="phone">Mobile No.:</label>
                    <input type="tel" name="phone" id="phone"><br><br>
                    <label for="pass">Entry Type:</label>
                   <select id="pass" name="pass">
                    <option value="court">Court Room</option>
                    <option value="journalist">Journalist</option>
                    <option value="intern">Intern</option>
                   </select><br><br>
                   <label for="validdate">Valid Till:</label>
                   <input type="text" id="validdate" name="validdate" value="07/11/2029" readonly><br><br>
                   <label for="remark">Remark:</label>
                   <input type="text-area" id="remark" name="remark" placeholder="write your feedback here.."><br><br>
                    <label for="photo">Uploaded Photo:</label>
                    <input type="file" id="photo" name="photo">
                </form>
                </div>
             </div>
           </div>
        </div>
    </div>
</body>
</html>
