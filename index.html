<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage Project</title>
    <style>
        body{
            place-items:center;
        }
        .container{
          
           background-color:brown;
            width:1500px;
            height:auto;
        }
.nav-bar{
   position:sticky;
    background-size:cover;
    display:flex;
    width:1500px;
    place-items:center;
    justify-content:space-between;
    gap:9rem;
    height:9rem;
}
.logo{padding-left:2px;}
.bar-list{
    display:inline-flex;
    padding-right:4rem;
    place-items:center;
    font-size:2rem;
    cursor:pointer;
    gap:10rem;
}
.judges-list{position:relative;}
.list{
    display:none;
    position:absolute;
    width:24rem;
    top:100%;
     z-index: 13;
    background-color:white;
    padding:3px;
    border-radius:4px;
    border:3px solid rgba(167, 42, 42,0.2);
}
.judges-list:hover .list {
 display:block;
}
#touch:hover{
    background-color: brown;
    padding:4px;
}
.list-options{
    list-style-type:none;
    padding-left:2px;
}
img{
    width:32%;
}
.gate-pass a{
    text-decoration: none;
    color: black;
}
.sub-container{
    background-image:url(court-photo.jpg);
    width:1500px;
    height:1244px;
    background-size:contain;
    border-radius:4rem solid white;
    display:block;
    place-items: center;
    justify-content:center;
}
.details{
    width:1500px;
    height:3rem;
   font-size:2rem;

    color:white;
    background-color:black;
    text-align:center;
}
.form{
    width:1039px;
    height:1105px;
  margin-top:2rem;
  display:flex;
  place-items:center;
  justify-content:center;
   border-radius:5rem solid white;
  background-color: rgba(184, 28, 28, 0.2); /* Semi-transparent background is required */
     

}
.main-form{
    width:1059px;
    height:992px;
   
    align-items:center;
}
form{
    width:1267px;
    height:1223px;
}

.form-grid{
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 1.25rem 1.3rem;
    padding: 1.25rem;
}

.field{
    display: flex;
    flex-direction: column;
}

.field label ,h3{
    font-size: 1.6rem;
    font-weight:bold;
    margin-bottom: .35rem;
    color:rgb(240, 233, 233);
}

.field input, .field textarea{
    padding: .5rem;
    width:27rem;
    font-size: 1rem;
    background-color:white;
}
.field select{
 padding:.5rem;
 width:28rem;
 font-size:1rem;
 background-color:white;
}

    button{
        font-size:2rem;
        border-color:white;
        background-color:rgb(65, 12, 12);
        color:white;
      margin-left:6rem;
      margin-top:3rem;
        }
  
    </style>

</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <div class="logo"><img src="court-logo.png" alt="Court logo"></div>
              
        </nav>
        <div class="sub-container">
            <div class="details">PRIMARY VISITOR DETAILS</div>
            <div class="form">
                <div class="main-form">
                 <form>
                    <div class="form-grid">
                        <div class="field">
                            <label for="pname">Name:</label>
                            <input type="text" name="pname" id="pname" placeholder="name here" required>
                        </div>

                        <div class="field">
                            <label for="phone">Mobile No.:</label>
                            <input type="tel" name="phone" id="phone" inputmode="numeric" required>
                        </div>

                        <div class="field">
                            <label for="fathername">Father/Spouse Name:</label>
                            <input type="text" id="fathername" name="fathername" required placeholder="father's name or spouse">
                        </div>

                        <div class="field">
                            <label for="pass">Entry Type:</label>
                            <select id="pass" name="pass" required>
                                <option value="">Choose your entry</option>
                                <option value="court">Court Room</option>
                                <option value="journalist">Journalist</option>
                                <option value="intern">Intern</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="add">Address:</label>
                            <input name="add" id="add" placeholder="address of the person" >
                        </div>
                     <div class="field">
                            <label for="occupy">Occupation:</label>
                            <select name="occupy" id="occupy" required>
                                <option value="" disabled selected hidden>Choose an option...</option>
                                <option value="teacher">Teacher</option>
                                <option value="doctor">Doctor</option>
                                <option value="engineer">Engineer</option>
                                <option value="farmer">Farmer</option>
                                <option value="household">Household</option>
                            </select>
                        </div>


                        <div class="field">
                            <label for="proof">Identity Proof:</label>
                            <select name="proof" id="proof" required>
                                <option value="" disabled selected hidden>Choose an option</option>
                                <option value="adharcard">Adhar Card</option>
                                <option value="voterId">Voter Id</option>
                                <option value="passssPort">PassPort</option>
                                <option value="driving">Driving License</option>
                            </select>
                        </div>
                         <div class="field">
                            <label for="visit">Purpose of Visit:</label>
                            <select id="visit" name="visit" required>
                                <option value="" disabled selected hidden>Choose purpose</option>
                                <option value="court hearing">Court Hearing</option>
                                <option value="filing">Filing</option>
                                <option value="personal">Personal</option>
                                <option value="press">Press</option>
                                <option value="tender">Tender</option>
                                <option value="inspection">Inspection</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="visitdate">Visit Date:</label>
                            <input type="date" id="visitdate" name="visitname" placeholder="today's date">
                        </div>

                        <div class="field">
                            <label for="branch">Branch Name:</label>
                            <select id="branch" name="branch" required>
                                <option value="" disabled selected hidden>Choose wisely</option>
                                <option value="main buliding">Main Building</option>
                                <option value="accounts">Accounts</option>
                                <option value="medical">Medical</option>
                                <option value="inspection">Inspection</option>
                            </select>
                        </div>
                          <div class="field">
                            <label for="age">Age:</label>
                            <input type="number" name="age" id="age" placeholder="enter your age" required>
                        </div>

                        <div class="field">
                            <label for="gender">Gender:</label>
                            <select id="gender" name="gender" required>
                                <option value="" disabled selected hidden>Choose gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                              
                            </select>
                        </div>

                         <div class="field">
                            <label for="photo">Uploaded Photo:</label>
                            <input type="file" id="photo" name="photo">
                        </div>
                      

                        <div class="save">
                         <button type="submit" class="save-data" onclick="f1()">Save</button>
                         <button type="button" class="delete-data" onclick="f2()">Delete</button>
                        </div>
                    </div>
                </form>
                </div>
             </div>
           </div>
        </div>
    </div>
    <script src="gate-pass.js"></script>
</body>
</html>
