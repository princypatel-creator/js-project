<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage Project</title>
    <style>
        body{
            place-items:center;
        }
        .container{
          
           
            width:1500px;
            height:auto;
        }
.nav-bar{
   
    background-size:cover;
    display:flex;
    width:1500px;
    place-items:center;
    justify-content:space-between;
    gap:9rem;
    height:9rem;
}
.logo{padding-left:2px;}
.bar-list{
    display:inline-flex;
    padding-right:4rem;
    place-items:center;
    font-size:2rem;
    cursor:pointer;
    gap:10rem;
}
.judges-list{position:relative;}
.list{
    display:none;
    position:absolute;
    width:24rem;
    top:100%;
     z-index: 13;
    background-color:white;
    padding:3px;
    border-radius:4px;
    border:3px solid rgba(167, 42, 42,0.2);
}
.judges-list:hover .list {
 display:block;
}
#touch:hover{
    background-color: brown;
    padding:4px;
}
.list-options{
    list-style-type:none;
    padding-left:2px;
}
img{
    width:32%;
}
.gate-pass a{
    text-decoration: none;
    color: black;
}
.sub-container{
    background-image:url(court-photo.jpg);
    width:1500px;
    height:1244px;
    background-size:contain;
    border-radius:4rem solid white;
    display:block;
    place-items: center;
    justify-content:center;
}
.details{
    width:1500px;
    height:3rem;
   font-size:2rem;

    color:white;
    background-color:black;
    text-align:center;
}
.form{
    width:1039px;
    height:1105px;
  margin-top:2rem;
  display:flex;
  place-items:center;
  justify-content:center;
   border-radius:5rem solid white;
      background-color: rgba(184, 28, 28, 0.2); /* Semi-transparent background is required */
  backdrop-filter: blur(10px);    

}
.main-form{
    width:1059px;
    height:992px;
   
    align-items:center;
}
form{
    width:1267px;
    height:1223px;
}

.form-grid{
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 1.25rem 1.3rem;
    padding: 1.25rem;
}

.field{
    display: flex;
    flex-direction: column;
}

.field label ,h3{
    font-size: 1.6rem;
    font-weight:bold;
    margin-bottom: .35rem;
    color:rgb(240, 233, 233);
}

.field input, .field textarea{
    padding: .5rem;
    width:27rem;
    font-size: 1rem;
    background-color:white;
}
.field select{
 padding:.5rem;
 width:28rem;
 font-size:1rem;
 background-color:white;
}

/* Radios group */
.gender-options{
   width:131px;
   display:flex;
   column-gap: 4px;
}

.gender-options label{
    display:inline-flex;
    align-items:start;

    margin: 0;
}
    button{
        font-size:2rem;
        border-color:white;
        background-color:rgb(65, 12, 12);
        color:white;
      margin-left:6rem;
      margin-top:3rem;
        }
    </style>

</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <div class="logo"><img src="court-logo.png" alt="Court logo"></div>
                <div class="bar-list">
                <div id="touch"><a>HOME</a></div>
                <div class="judges-list" id="touch"><a>JUDGES</a>
                <div class="list">
                    <ul class="list-options">
                        <li>Hon'ble Cheif Justice and Sitting Judges</li>
                        <li>Hon'ble Judges as Chief Justice of India</li>
                        <li>Former Hon'ble Chief Justices</li>
                        <li>Former Hon'ble Judges</li>
                        <li>Assets of Judges</li>
                    </ul>
                </div>
            </div>
                <div class="gate-pass" id="touch"><a href="gate-pass.html">GATEPASS</a></div>

            </div>
        </nav>
        <div class="sub-container">
            <div class="details">PRIMARY VISITOR DETAILS</div>
            <div class="form">
                <div class="main-form">
                 <form onsubmit="myfun(event)">
                    <div class="form-grid">
                        <div class="field">
                            <label for="names">Name:</label>
                            <input type="text" name="names" id="names" placeholder="name here">
                        </div>

                        <div class="field">
                            <label for="phone">Mobile No.:</label>
                            <input type="tel" name="phone" id="phone" >
                        </div>

                        <div class="field">
                            <label for="fathername">Father/Spouse Name:</label>
                            <input type="text" id="fathername" name="fathername" placeholder="father's name or spouse">
                        </div>

                        <div class="field">
                            <label for="pass">Entry Type:</label>
                            <select id="pass" name="pass">
                                <option value="">Choose your entry</option>
                                <option value="court">Court Room</option>
                                <option value="journalist">Journalist</option>
                                <option value="intern">Intern</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="add">Address:</label>
                            <textarea name="add" id="add" placeholder="you can write up to 42 characters" rows="3"></textarea>
                        </div>

                        <div class="field">
                            <label for="validdate">Valid Till:</label>
                            <input type="text" id="validdate" name="validdate" value="07/11/2029" readonly>
                        </div>

                        <div class="field">
                            <label for="occupy">Occupation:</label>
                            <select name="occupy" id="occupy">
                                <option value="" disabled selected hidden>Choose an option...</option>
                                <option value="teacher">Teacher</option>
                                <option value="doctor">Doctor</option>
                                <option value="engineer">Engineer</option>
                                <option value="farmer">Farmer</option>
                                <option value="household">Household</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="remark">Remark:</label>
                            <textarea id="remark" name="remark" placeholder="write your feedback here.." rows="3"></textarea>
                        </div>

                        <div class="field">
                            <label for="proof">Identity Proof:</label>
                            <select name="proof" id="proof">
                                <option value="" disabled selected hidden>Choose an option</option>
                                <option value="adharcard">Adhar Card</option>
                                <option value="voterId">Voter Id</option>
                                <option value="passssPort">PassPort</option>
                                <option value="driving">Driving License</option>
                            </select>
                        </div>
                         <div class="field">
                            <label for="visit">Purpose of Visit:</label>
                            <select id="visit" name="visit">
                                <option value="" disabled selected hidden>Choose purpose</option>
                                <option value="court hearing">Court Hearing</option>
                                <option value="filing">Filing</option>
                                <option value="personal">Personal</option>
                                <option value="press">Press</option>
                                <option value="tender">Tender</option>
                                <option value="inspection">Inspection</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="visitdate">Visit Date:</label>
                            <input type="text" id="visitdate" name="visitname" value="7-11-2026" readonly>
                        </div>

                        <div class="field">
                            <label for="branch">Branch Name:</label>
                            <select id="branch" name="branch">
                                <option value="" disabled selected hidden>Choose wisely</option>
                                <option value="main buliding">Main Building</option>
                                <option value="accounts">Accounts</option>
                                <option value="medical">Medical</option>
                                <option value="inspection">Inspection</option>
                            </select>
                        </div>
                          <div class="field">
                            <label for="age">Age:</label>
                            <input type="number" name="age" id="age" placeholder="use arrows">
                        </div>

                        <div class="field">
                            <h3 for="gender">Gender:</h3>
                            <div class="gender-options">
                                <input type="radio" name="gender" id="gender" value="male" required><label for="gender">Male</label>
                                <input type="radio" name="gender" id="gender" value="female" required><label for="gender">Female</label>
                                <input type="radio" name="gender" id="gender" value="transgender" required><label for="gender">Both</label>
                            </div>
                        </div>

                         <div class="field">
                            <label for="photo">Uploaded Photo:</label>
                            <input type="file" id="photo" name="photo">
                        </div>
                      

                        <div class="save">
                         <button type="submit" class="save-data">Save</button>
                         <button type="delete" class="delete-data">Delete</button>
                        </div>
                    </div>
                </form>
                </div>
             </div>
           </div>
        </div>
    </div>
    <script src="gate-pass.js"></script>
</body>
</html>
